<script>
  // Fallback #2: if both CDN attempts above failed (e.g. fully offline), keep retrying
  // a couple more mirrors in the background without blocking page render.
  (function ensureChartJs(){
    if (typeof Chart !== 'undefined') return;
    var mirrors = [
      'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.min.js'
    ];
    var i = 0;
    function tryNext(){
      if (typeof Chart !== 'undefined' || i >= mirrors.length) return;
      var s = document.createElement('script');
      s.src = mirrors[i++];
      s.onload = function(){ /* loaded */ };
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    // give the primary/fallback <script> tags a tick to finish before trying mirrors
    setTimeout(tryNext, 0);
  })();
</script>

<script>
/* ---------------- Data ---------------- */
const CATS = ["Housing","Food & Dining","Transport","Utilities","Entertainment","Shopping","Health","Salary","Freelance","Other"];
const EXPENSE_CATS = CATS.filter(c=>!["Salary","Freelance"].includes(c));
const todayISO = () => new Date().toISOString().slice(0,10);
const monthKey = d => d.slice(0,7);
const thisMonth = monthKey(todayISO());
const lastMonthDate = new Date(); lastMonthDate.setMonth(lastMonthDate.getMonth()-1);
const lastMonth = monthKey(lastMonthDate.toISOString().slice(0,10));
const fmt = n => "₹" + Math.round(n).toLocaleString('en-IN');
const fmtSigned = n => (n>=0?"+":"−") + "₹" + Math.abs(Math.round(n)).toLocaleString('en-IN');

function seedTransactions(){
  const mk = (offsetDays, type, cat, amt, desc) => {
    const d = new Date(); d.setDate(1); d.setDate(d.getDate()+offsetDays);
    return {id: crypto.randomUUID(), type, category:cat, amount:amt, description:desc, date:d.toISOString().slice(0,10)};
  };
  return [
    mk(0,'income','Salary',85000,'Monthly salary'),
    mk(1,'expense','Housing',22000,'Rent'),
    mk(2,'expense','Utilities',2400,'Electricity + water'),
    mk(3,'expense','Food & Dining',3200,'Groceries'),
    mk(5,'expense','Food & Dining',2600,'Restaurants'),
    mk(6,'expense','Transport',1800,'Fuel'),
    mk(7,'expense','Entertainment',1500,'Streaming + movies'),
    mk(9,'expense','Shopping',4200,'Clothing'),
    mk(10,'income','Freelance',9000,'Design project'),
    mk(11,'expense','Health',1200,'Pharmacy'),
    mk(13,'expense','Food & Dining',2100,'Dining out'),
    mk(15,'expense','Transport',900,'Cab rides'),
    mk(16,'expense','Shopping',1600,'Electronics accessory'),
    mk(18,'expense','Food & Dining',1800,'Dining out'),
    mk(20,'expense','Utilities',600,'Mobile recharge'),
    mk(22,'expense','Entertainment',800,'Concert ticket'),
    // last month, for trend comparisons
    mkPast(-8,'expense','Food & Dining',5600,'Groceries + dining'),
    mkPast(-15,'expense','Housing',22000,'Rent'),
    mkPast(-20,'income','Salary',85000,'Monthly salary'),
    mkPast(-25,'expense','Transport',2500,'Fuel'),
  ];
  function mkPast(offsetDays, type, cat, amt, desc){
    const d = new Date(); d.setDate(d.getDate()+offsetDays);
    return {id: crypto.randomUUID(), type, category:cat, amount:amt, description:desc, date:d.toISOString().slice(0,10)};
  }
}

function loadState(){
  const raw = localStorage.getItem('finsight_v1');
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return {
    transactions: seedTransactions(),
    goals: [
      {id: crypto.randomUUID(), name:'Emergency Fund', target:150000, current:42000, deadline: addMonths(8)},
      {id: crypto.randomUUID(), name:'Goa Trip', target:60000, current:18000, deadline: addMonths(4)},
      {id: crypto.randomUUID(), name:'New Laptop', target:90000, current:30000, deadline: addMonths(6)},
    ],
    investments: [
      {id:1, name:'Index Fund — Nifty 50', type:'Equity', invested:120000, currentValue:138500},
      {id:2, name:'Corporate Bond Fund', type:'Debt', invested:60000, currentValue:63200},
      {id:3, name:'Gold ETF', type:'Gold', invested:25000, currentValue:27900},
      {id:4, name:'Direct Stocks', type:'Equity', invested:40000, currentValue:37600},
    ],
    simGoalId: null,
    simAdjustments: {}
  };
  function addMonths(n){ const d=new Date(); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
}
let state = loadState();
function save(){ localStorage.setItem('finsight_v1', JSON.stringify(state)); }

/* ---------------- Derived metrics ---------------- */
function monthTx(mk){ return state.transactions.filter(t=>monthKey(t.date)===mk); }
function sumBy(txs, type){ return txs.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0); }
function categoryTotals(txs){
  const m = {};
  txs.filter(t=>t.type==='expense').forEach(t=>{ m[t.category]=(m[t.category]||0)+t.amount; });
  return m;
}
function totalBalance(){
  const inc = sumBy(state.transactions,'income'), exp = sumBy(state.transactions,'expense');
  const invested = state.investments.reduce((s,i)=>s+i.currentValue,0);
  return inc - exp + invested*0; // balance = cash flow net; investments shown separately
}
function healthScore(){
  const inc = sumBy(monthTx(thisMonth),'income') || 1;
  const exp = sumBy(monthTx(thisMonth),'expense');
  const savingsRate = Math.max(-1,(inc-exp)/inc);
  const goalPace = state.goals.length ? state.goals.reduce((s,g)=>s+Math.min(1,g.current/g.target),0)/state.goals.length : 0.5;
  const catT = categoryTotals(monthTx(thisMonth));
  const maxCat = Math.max(0,...Object.values(catT));
  const concentration = exp>0 ? 1-(maxCat/exp) : 1;
  let score = savingsRate*50 + goalPace*30 + concentration*20;
  score = Math.max(0, Math.min(100, Math.round(score+50*0.4)));
  return Math.max(5,Math.min(98,score));
}
function scoreLabel(s){ return s>=75?'Excellent':s>=55?'Good':s>=35?'Needs attention':'At risk'; }
function scoreColor(s){ return s>=75?'#22603F':s>=55?'#4E9A6E':s>=35?'#C4622D':'#B8433B'; }

/* ---------------- Rendering: shell/nav ---------------- */
const titles = {dashboard:'Dashboard',transactions:'Transactions',goals:'Financial Goals',investments:'Investments',insights:'Insights & Simulator',runway:'Runway & Trade-offs'};
document.getElementById('tabNav').addEventListener('click', e=>{
  const btn = e.target.closest('.tab-btn'); if(!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-ink/70');});
  btn.classList.add('active'); btn.classList.remove('text-ink/70');
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  const tab = btn.dataset.tab;
  document.getElementById('view-'+tab).classList.remove('hidden');
  document.getElementById('pageTitle').textContent = titles[tab];
  if(tab==='dashboard') renderDashboard();
  if(tab==='transactions') renderTransactions();
  if(tab==='goals') renderGoals();
  if(tab==='investments') renderInvestments();
  if(tab==='insights') renderInsights();
  if(tab==='runway') renderRunway();
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('translate-y-24','opacity-0');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.add('translate-y-24','opacity-0'), 2200);
}

/* ---------------- DASHBOARD ---------------- */
let chartSpend, chartTrend;
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const incThis = sumBy(monthTx(thisMonth),'income');
  const expThis = sumBy(monthTx(thisMonth),'expense');
  const incLast = sumBy(monthTx(lastMonth),'income');
  const expLast = sumBy(monthTx(lastMonth),'expense');
  const savings = incThis - expThis;
  const savingsRate = incThis>0 ? Math.round((savings/incThis)*100) : 0;
  const balance = sumBy(state.transactions,'income') - sumBy(state.transactions,'expense');
  const invValue = state.investments.reduce((s,i)=>s+i.currentValue,0);
  const score = healthScore();
  const cat = categoryTotals(monthTx(thisMonth));
  const recent = [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);

  el.innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
      ${statCard('Total balance', fmt(balance+invValue*0), 'Cash + net flow', 'ink', ICONS.wallet)}
      ${statCard('Monthly income', fmt(incThis), pctChange(incThis,incLast), 'moss', ICONS.trendUp)}
      ${statCard('Monthly expenses', fmt(expThis), pctChange(expThis,expLast,true), 'clay', ICONS.trendDown)}
      ${statCard('Savings this month', fmt(savings), savingsRate+'% savings rate', savings>=0?'moss':'danger', ICONS.piggy)}
    </div>

    <div class="grid lg:grid-cols-3 gap-4">
      <div class="card card-hover p-5 lg:col-span-1 flex flex-col items-center justify-center text-center">
        <p class="text-xs font-semibold text-ink/50 mb-3">Financial health score</p>
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" fill="none" stroke="#EEEBE0" stroke-width="12"/>
          <circle cx="70" cy="70" r="58" fill="none" stroke="${scoreColor(score)}" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${2*Math.PI*58}" stroke-dashoffset="${2*Math.PI*58*(1-score/100)}"
            transform="rotate(-90 70 70)" style="transition: stroke-dashoffset .6s cubic-bezier(.22,.9,.35,1)"/>
          <text x="70" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="#0B1F1B" font-family="IBM Plex Mono">${score}</text>
          <text x="70" y="86" text-anchor="middle" font-size="11" fill="#6b6b60">/ 100</text>
        </svg>
        <p class="text-sm font-bold mt-2" style="color:${scoreColor(score)}">${scoreLabel(score)}</p>
        <p class="text-xs text-ink/50 mt-1 max-w-[220px]">Based on savings rate, goal progress and spending concentration.</p>
      </div>
      <div class="card card-hover p-5 lg:col-span-1">
        <p class="text-xs font-semibold text-ink/50 mb-3">Spending breakdown — this month</p>
        <canvas id="spendChart" height="200" role="img" aria-label="Spending by category donut chart"></canvas>
      </div>
      <div class="card card-hover p-5 lg:col-span-1">
        <p class="text-xs font-semibold text-ink/50 mb-3">Income vs expense — 6 months</p>
        <canvas id="trendChart" height="200" role="img" aria-label="Income versus expense bar chart"></canvas>
      </div>
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <p class="text-xs font-semibold text-ink/50">Recent transactions</p>
        <button onclick="switchTab('transactions')" class="text-xs font-semibold text-moss-700 hover:underline btn-press">View all →</button>
      </div>
      <div class="divide-y divide-[#F0EDE3]">
        ${recent.map(txRow).join('') || emptyState('No transactions yet — add your first one to see it here.')}
      </div>
    </div>
  `;

  if(chartSpend) chartSpend.destroy();
  const labels = Object.keys(cat), data = Object.values(cat);
  chartSpend = new Chart(document.getElementById('spendChart'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:palette(labels.length), borderWidth:2, borderColor:'#fff' }]},
    options:{ plugins:{ legend:{ position:'bottom', labels:{ boxWidth:8, font:{size:10.5}, padding:10 } } }, cutout:'62%' }
  });

  if(chartTrend) chartTrend.destroy();
  const months = last6Months();
  chartTrend = new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{ labels: months.map(m=>m.label),
      datasets:[
        {label:'Income', data: months.map(m=>sumBy(monthTx(m.key),'income')), backgroundColor:'#4E9A6E', borderRadius:4},
        {label:'Expenses', data: months.map(m=>sumBy(monthTx(m.key),'expense')), backgroundColor:'#C4622D', borderRadius:4},
      ]},
    options:{ scales:{ y:{ ticks:{ callback:v=>'₹'+(v/1000)+'k', font:{size:10} } }, x:{ ticks:{ font:{size:10.5} } } },
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:8, font:{size:10.5} } } } }
  });
}
function last6Months(){
  const arr=[];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    arr.push({key: d.toISOString().slice(0,7), label: d.toLocaleString('en-IN',{month:'short'})}); }
  return arr;
}
function pctChange(cur, prev, inverse){
  if(!prev) return 'No prior data';
  const pct = Math.round(((cur-prev)/prev)*100);
  const good = inverse ? pct<=0 : pct>=0;
  return `<span class="${good?'text-moss-600':'text-danger'}">${pct>=0?'+':''}${pct}%</span> vs last month`;
}
function statCard(label,val,sub,tone,icon){
  const tones = {ink:'text-ink',moss:'text-moss-600',clay:'text-clay',danger:'text-danger'};
  const accentBg = {ink:'#0B1F1B',moss:'#22603F',clay:'#C4622D',danger:'#B8433B'}[tone]||'#0B1F1B';
  const iconHtml = icon ? `<div class="icon-box w-9 h-9 mb-2.5" style="background:${accentBg}14;color:${accentBg}">${icon}</div>` : '';
  return `<div class="card card-hover p-4 md:p-5 relative overflow-hidden">
    <div class="kpi-accent" style="background:${accentBg}"></div>
    ${iconHtml}
    <p class="text-xs font-semibold text-ink/50">${label}</p>
    <p class="num text-xl md:text-2xl font-extrabold mt-1.5 ${tones[tone]||''}">${val}</p>
    <p class="text-xs text-ink/50 mt-1.5">${sub}</p>
  </div>`;
}
function palette(n){ const p=['#22603F','#4E9A6E','#C4622D','#B8433B','#8C7B4E','#5B7FA6','#9A6E4E','#6E5B9A','#4E9A9A','#9A4E7B']; return Array.from({length:n},(_,i)=>p[i%p.length]); }
function switchTab(tab){ document.querySelector(`.tab-btn[data-tab="${tab}"]`).click(); }

function txRow(t){
  const sign = t.type==='income' ? '+' : '−';
  const color = t.type==='income' ? 'text-moss-600' : 'text-ink';
  return `<div class="flex items-center gap-3 py-2.5 row-hover -mx-1.5 px-1.5 rounded-lg hover:bg-[#FAF8F2]">
    ${categoryIconBox(t.category, 32)}
    <div class="min-w-0 flex-1">
      <p class="text-sm font-semibold truncate">${escapeHtml(t.description)}</p>
      <p class="text-xs text-ink/45">${t.category} · ${formatDate(t.date)}</p>
    </div>
    <p class="num text-sm font-bold shrink-0 ${color}">${sign}${fmt(t.amount)}</p>
  </div>`;
}
function emptyRow(msg){ return `<div class="py-6 text-center text-sm text-ink/40">${msg}</div>`; }
function emptyState(msg, action){
  return `<div class="py-8 text-center">
    <div class="icon-box w-11 h-11 mx-auto mb-3" style="background:#F0EDE3">${ICONS.empty}</div>
    <p class="text-sm text-ink/45 max-w-xs mx-auto">${msg}</p>
    ${action?`<p class="text-xs text-ink/35 mt-1">${action}</p>`:''}
  </div>`;
}
function formatDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

const CAT_ICON_KEY = { 'Housing':'home','Food & Dining':'food','Transport':'transport','Utilities':'utilities','Entertainment':'entertainment','Shopping':'shopping','Health':'health','Salary':'salary','Freelance':'freelance','Other':'other' };
const CAT_ICON_COLOR = { 'Housing':'#5B7FA6','Food & Dining':'#C4622D','Transport':'#8C7B4E','Utilities':'#9A6E4E','Entertainment':'#6E5B9A','Shopping':'#B8433B','Health':'#4E9A9A','Salary':'#22603F','Freelance':'#2F7A52','Other':'#6b6b60' };
function categoryIconBox(cat, size){
  size = size || 32;
  const key = CAT_ICON_KEY[cat] || 'other';
  const color = CAT_ICON_COLOR[cat] || '#6b6b60';
  return `<div class="icon-box" style="width:${size}px;height:${size}px;background:${color}16;color:${color}">${ICONS[key]}</div>`;
}
function goalIconBox(name){
  const n = (name||'').toLowerCase();
  if(n.includes('emergen')||n.includes('safety')||n.includes('fund')) return photoIconBox(IMG_B64.emergency,'#22603F',52);
  if(n.includes('trip')||n.includes('travel')||n.includes('vacation')||n.includes('goa')) return photoIconBox(IMG_B64.travel,'#5B7FA6',52);
  if(n.includes('laptop')||n.includes('phone')||n.includes('gadget')||n.includes('electronic')) return photoIconBox(IMG_B64.laptop,'#8C7B4E',52);
  let key='goalDefault', color='#2F7A52';
  if(n.includes('save')||n.includes('piggy')){ key='piggy'; color='#C4622D'; }
  return `<div class="icon-box w-11 h-11" style="background:${color}14;color:${color}">${ICONS[key]}</div>`;
}
function photoIconBox(dataUri, color, size){
  size = size || 52;
  return `<div class="icon-box overflow-hidden" style="width:${size}px;height:${size}px;border:1.5px solid ${color}33">
    <img src="${dataUri}" alt="" class="w-full h-full object-cover" loading="lazy">
  </div>`;
}
const ASSET_ICON = { Equity:{key:'equity',color:'#C4622D'}, Debt:{key:'debt',color:'#5B7FA6'}, Gold:{key:'gold',color:'#8C7B4E'} };
function assetIconBox(type, size){
  size = size || 32;
  if(type==='Equity') return photoIconBox(IMG_B64.equity,'#C4622D',size);
  if(type==='Debt') return photoIconBox(IMG_B64.debt,'#5B7FA6',size);
  const a = ASSET_ICON[type] || {key:'goalDefault', color:'#6b6b60'};
  return `<div class="icon-box" style="width:${size}px;height:${size}px;background:${a.color}16;color:${a.color}">${ICONS[a.key]}</div>`;
}

/* ---------------- TRANSACTIONS ---------------- */
let txFilter = {q:'', type:'all', cat:'all'};
function renderTransactions(){
  const el = document.getElementById('view-transactions');
  el.innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:justify-between">
      <div class="flex flex-1 flex-col sm:flex-row gap-2">
        <input id="txSearch" type="search" placeholder="Search transactions…" value="${txFilter.q}"
          class="w-full sm:w-64 border border-[#E3DFD1] rounded-lg px-3 py-2 text-sm bg-white" aria-label="Search transactions">
        <select id="txFilterType" class="border border-[#E3DFD1] rounded-lg px-3 py-2 text-sm bg-white" aria-label="Filter by type">
          <option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option>
        </select>
        <select id="txFilterCat" class="border border-[#E3DFD1] rounded-lg px-3 py-2 text-sm bg-white" aria-label="Filter by category">
          <option value="all">All categories</option>${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}
        </select>
      </div>
      <button onclick="openTxModal()" class="btn-press shrink-0 bg-ink text-white text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-moss-700 shadow-sm hover:shadow-md">+ Add transaction</button>
    </div>
    <div class="card overflow-hidden">
      <div class="overflow-x-auto nice-scroll">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-xs text-ink/45 border-b border-[#F0EDE3]">
            <th class="px-4 py-3 font-semibold">Description</th><th class="px-4 py-3 font-semibold">Category</th>
            <th class="px-4 py-3 font-semibold">Date</th><th class="px-4 py-3 font-semibold text-right">Amount</th>
            <th class="px-4 py-3 font-semibold text-right">Actions</th></tr></thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
    </div>`;
  document.getElementById('txSearch').oninput = e=>{ txFilter.q=e.target.value.toLowerCase(); renderTxTable(); };
  document.getElementById('txFilterType').onchange = e=>{ txFilter.type=e.target.value; renderTxTable(); };
  document.getElementById('txFilterCat').onchange = e=>{ txFilter.cat=e.target.value; renderTxTable(); };
  renderTxTable();
}
function renderTxTable(){
  const body = document.getElementById('txTableBody');
  let rows = [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date));
  if(txFilter.q) rows = rows.filter(t=>t.description.toLowerCase().includes(txFilter.q)||t.category.toLowerCase().includes(txFilter.q));
  if(txFilter.type!=='all') rows = rows.filter(t=>t.type===txFilter.type);
  if(txFilter.cat!=='all') rows = rows.filter(t=>t.category===txFilter.cat);
  body.innerHTML = rows.map(t=>`
    <tr class="border-b border-[#F5F3EA] row-hover hover:bg-[#FAF8F2]">
      <td class="px-4 py-3 font-semibold"><div class="flex items-center gap-2.5">${categoryIconBox(t.category,26)}<span class="truncate">${escapeHtml(t.description)}</span></div></td>
      <td class="px-4 py-3 text-ink/60">${t.category}</td>
      <td class="px-4 py-3 text-ink/60">${formatDate(t.date)}</td>
      <td class="px-4 py-3 text-right num font-bold ${t.type==='income'?'text-moss-600':'text-ink'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</td>
      <td class="px-4 py-3 text-right whitespace-nowrap">
        <button onclick="openTxModal('${t.id}')" class="text-xs font-semibold text-ink/60 hover:text-ink px-2 py-1 btn-press">Edit</button>
        <button onclick="deleteTx('${t.id}')" class="text-xs font-semibold text-danger hover:underline px-2 py-1 btn-press">Delete</button>
      </td>
    </tr>`).join('') || `<tr><td colspan="5">${emptyState('No matching transactions — try adjusting your filters.')}</td></tr>`;
}
function deleteTx(id){
  state.transactions = state.transactions.filter(t=>t.id!==id);
  save(); renderTxTable(); toast('Transaction deleted');
}

/* Transaction modal */
let currentTxType = 'expense';
function populateCatSelect(){
  const sel = document.getElementById('txCategory');
  const cats = currentTxType==='income' ? ['Salary','Freelance','Other'] : EXPENSE_CATS.filter(c=>c!=='Other').concat('Other');
  sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}
document.querySelectorAll('.txType-btn').forEach(b=>b.addEventListener('click',()=>{
  currentTxType = b.dataset.type; setTxTypeUI(); populateCatSelect();
}));
function setTxTypeUI(){
  document.querySelectorAll('.txType-btn').forEach(b=>{
    const on = b.dataset.type===currentTxType;
    b.className = 'txType-btn py-2 rounded-lg text-sm font-semibold border transition-colors ' + (on
      ? (currentTxType==='income' ? 'bg-moss-50 border-moss-400 text-moss-700' : 'bg-[#FBEDE6] border-clay text-clay')
      : 'border-[#E3DFD1] text-ink/60 hover:bg-sand/50');
  });
}
function openTxModal(id){
  const modal = document.getElementById('txModal');
  document.getElementById('txForm').reset();
  document.getElementById('txId').value = id||'';
  if(id){
    const t = state.transactions.find(x=>x.id===id);
    document.getElementById('txModalTitle').textContent = 'Edit transaction';
    currentTxType = t.type; setTxTypeUI(); populateCatSelect();
    document.getElementById('txAmount').value = t.amount;
    document.getElementById('txCategory').value = t.category;
    document.getElementById('txDesc').value = t.description;
    document.getElementById('txDate').value = t.date;
  } else {
    document.getElementById('txModalTitle').textContent = 'Add transaction';
    currentTxType = 'expense'; setTxTypeUI(); populateCatSelect();
    document.getElementById('txDate').value = todayISO();
  }
  modal.classList.remove('hidden'); modal.classList.add('flex');
  document.getElementById('txAmount').focus();
}
function closeTxModal(){ const m=document.getElementById('txModal'); m.classList.add('hidden'); m.classList.remove('flex'); }
document.getElementById('txForm').addEventListener('submit', e=>{
  e.preventDefault();
  const id = document.getElementById('txId').value;
  const payload = {
    type: currentTxType,
    amount: parseFloat(document.getElementById('txAmount').value),
    category: document.getElementById('txCategory').value,
    description: document.getElementById('txDesc').value.trim(),
    date: document.getElementById('txDate').value,
  };
  if(id){
    const t = state.transactions.find(x=>x.id===id); Object.assign(t,payload);
    toast('Transaction updated');
  } else {
    state.transactions.push({id: crypto.randomUUID(), ...payload});
    toast('Transaction added');
  }
  save(); closeTxModal();
  renderDashboardIfActive(); renderTransactions();
});
function renderDashboardIfActive(){ if(!document.getElementById('view-dashboard').classList.contains('hidden')) renderDashboard(); }

/* ---------------- GOALS ---------------- */
function renderGoals(){
  const el = document.getElementById('view-goals');
  const inc = sumBy(monthTx(thisMonth),'income'), exp = sumBy(monthTx(thisMonth),'expense');
  const freeCash = Math.max(0, inc-exp);
  el.innerHTML = `
    <div class="flex items-center justify-between">
      <p class="text-sm text-ink/55 max-w-md">Track savings goals and see the monthly amount required to reach each deadline.</p>
      <button onclick="openGoalModal()" class="btn-press shrink-0 bg-ink text-white text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-moss-700 shadow-sm hover:shadow-md">+ New goal</button>
    </div>
    <div class="grid md:grid-cols-2 gap-4" id="goalsGrid"></div>
  `;
  const grid = document.getElementById('goalsGrid');
  grid.innerHTML = state.goals.map(g=>{
    const pct = Math.min(100, Math.round((g.current/g.target)*100));
    const monthsLeft = Math.max(1, monthsBetween(todayISO(), g.deadline));
    const remaining = Math.max(0, g.target-g.current);
    const needed = remaining/monthsLeft;
    const feasible = needed <= freeCash || freeCash===0 ? needed<=Math.max(freeCash,1) : false;
    return `<div class="card card-hover p-5">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-start gap-3 min-w-0">
          ${goalIconBox(g.name)}
          <div class="min-w-0">
            <p class="font-bold truncate">${escapeHtml(g.name)}</p>
            <p class="text-xs text-ink/45 mt-0.5">Target: ${formatDate(g.deadline)}</p>

function generateInsights(){
  const insights = [];
  const catThis = categoryTotals(monthTx(thisMonth));
  const catLast = categoryTotals(monthTx(lastMonth));
  Object.keys(catThis).forEach(c=>{
    if(catLast[c]){
      const pct = Math.round(((catThis[c]-catLast[c])/catLast[c])*100);
      if(pct>=15) insights.push({type:'warn', text:`${c} expenses increased ${pct}% this month compared to last month.`});
      if(pct<=-15) insights.push({type:'good', text:`${c} expenses dropped ${Math.abs(pct)}% this month — nice work.`});
    }
  });
  const inc = sumBy(monthTx(thisMonth),'income'), exp = sumBy(monthTx(thisMonth),'expense');
  const rate = inc>0 ? Math.round((inc-exp)/inc*100) : 0;
  insights.push({type: rate>=20?'good':'warn', text:`Your current savings rate is ${rate}% of income. ${rate>=20?'That is a healthy buffer.':'Aim for at least 20% to build momentum toward your goals.'}`});
  const topCat = Object.entries(catThis).sort((a,b)=>b[1]-a[1])[0];
  if(topCat && state.goals[0]){
    const g = state.goals[0];
    const remaining = Math.max(0,g.target-g.current);
    const monthsLeft = monthsBetween(todayISO(), g.deadline);
    const cut = Math.round(topCat[1]*0.2/100)*100;
    if(cut>0){
      const newMonthly = remaining/monthsLeft - cut;
      insights.push({type:'tip', text:`Reducing ${topCat[0]} by ${fmt(cut)}/month could shorten the time needed to reach "${g.name}" — try the simulator below.`});
    }
  }
  return insights;
}

/* ---------------- FINANCIAL RUNWAY — STRESS TEST (signature feature) ---------------- */
const DEPLETION_ORDER = ['Liquid Cash','Debt','Gold','Equity']; // assumption: most liquid / least volatile depletes first
let runwayState = { incomeCut:0, emergencyExpense:0, drawdown:0 };
const RUNWAY_PRESETS = {
  jobloss:    { incomeCut:100, emergencyExpense:0,     drawdown:0  },
  emergency:  { incomeCut:25,  emergencyExpense:20000, drawdown:0  },
  crash:      { incomeCut:0,   emergencyExpense:0,     drawdown:30 },
  reset:      { incomeCut:0,   emergencyExpense:0,     drawdown:0  },
};

function computeRunway(incomeCutPct, emergencyExpenseAmt, drawdownPct){
  incomeCutPct = clampNum(incomeCutPct,0,100);
  emergencyExpenseAmt = clampNum(emergencyExpenseAmt,0,50000);
  drawdownPct = clampNum(drawdownPct,0,40);

  const monthlyIncome = sumBy(monthTx(thisMonth),'income');
  const monthlyExpenses = sumBy(monthTx(thisMonth),'expense');
  const adjIncome = monthlyIncome * (1 - incomeCutPct/100);
  const adjExpenses = monthlyExpenses + emergencyExpenseAmt;
  const netCashFlow = adjIncome - adjExpenses;
  const burn = Math.max(0, adjExpenses - adjIncome);
  const liquidCash = Math.max(0, sumBy(state.transactions,'income') - sumBy(state.transactions,'expense'));

  const byType = { Debt:0, Gold:0, Equity:0 };
  const holdings = state.investments.map(inv=>{
    const applies = inv.type==='Equity' || inv.type==='Gold';
    const simulatedValue = applies ? inv.currentValue * (1 - drawdownPct/100) : inv.currentValue;
    byType[inv.type] = (byType[inv.type]||0) + simulatedValue;
    return { ...inv, simulatedValue, difference: simulatedValue - inv.currentValue, drawdownApplied: applies ? drawdownPct : 0 };
  });

  const pool = [
    {label:'Liquid Cash', amount: liquidCash},
    {label:'Debt', amount: byType.Debt||0},
    {label:'Gold', amount: byType.Gold||0},
    {label:'Equity', amount: byType.Equity||0},
  ].filter(a=>a.amount>0.5);

  const totalPool = pool.reduce((s,a)=>s+a.amount,0);
  const runwayMonths = netCashFlow<0 ? (burn>0 ? totalPool/burn : Infinity) : Infinity;

  let cum = 0;
  const schedule = pool.map(a=>{
    const monthsCovered = burn>0 ? a.amount/burn : Infinity;
    const startMonth = cum;
    cum += isFinite(monthsCovered) ? monthsCovered : 0;
    return { ...a, monthsCovered, startMonth, endMonth: cum };
  });

  return { monthlyIncome, monthlyExpenses, adjIncome, adjExpenses, netCashFlow, burn, liquidCash, totalPool, runwayMonths, schedule, holdings, byType, incomeCutPct, emergencyExpenseAmt, drawdownPct };
}
function clampNum(n,min,max){ n = Number(n); if(!isFinite(n)) n=0; return Math.max(min,Math.min(max,n)); }

function formatRunway(months){
  if(!isFinite(months) || months<=0) return months<=0 ? '0 days' : null;
  let totalDays = Math.round(months*30);
  let wholeMonths = Math.floor(totalDays/30);
  let days = totalDays - wholeMonths*30;
  const parts=[];
  if(wholeMonths>0) parts.push(`${wholeMonths} month${wholeMonths===1?'':'s'}`);
  if(days>0 || wholeMonths===0) parts.push(`${days} day${days===1?'':'s'}`);
  return parts.join(' ');
}
function runwayColor(netCashFlow, months){
  if(netCashFlow>=0) return '#22603F';
  if(!isFinite(months) || months>=12) return '#22603F';
  if(months>=6) return '#C4622D';
  return '#B8433B';
}
function stressLevel(netCashFlow, months){
  if(netCashFlow>=0) return {label:'POSITIVE CASH FLOW', tone:'LOW', color:'#22603F', bg:'#EFF6EE', border:'#DCEEDA'};
  if(!isFinite(months) || months>=12) return {label:'LOW', tone:'LOW', color:'#22603F', bg:'#EFF6EE', border:'#DCEEDA'};
  if(months>=6) return {label:'MODERATE', tone:'MODERATE', color:'#8C6A1E', bg:'#FBF3E0', border:'#EFDDAA'};
  if(months>=3) return {label:'HIGH', tone:'HIGH', color:'#C4622D', bg:'#FBEDE6', border:'#F0D2BE'};
  return {label:'CRITICAL', tone:'CRITICAL', color:'#B8433B', bg:'#FBE8E6', border:'#F0C7C2'};
}

              ${photoIconBox(IMG_B64.market_crash,'#0B1F1B',34)}
              <span><span class="flex items-center gap-1.5 text-sm font-bold">Market Crash</span><span class="block text-[11px] text-ink/50 mt-0.5">30% drawdown</span></span></button>
            <button data-preset="reset" id="rReset" class="preset-btn text-left px-3.5 py-2.5 rounded-lg border border-[#E3DFD1] hover:border-moss-400 hover:bg-moss-50 transition-colors flex items-center gap-2.5">
              <span class="icon-box w-[34px] h-[34px]" style="background:#22603F14;color:#22603F">${ICONS.reset}</span>
              <span><span class="flex items-center gap-1.5 text-sm font-bold">Reset</span><span class="block text-[11px] text-ink/50 mt-0.5">Back to current situation</span></span></button>
          </div>
          <p class="text-[11px] text-ink/40 mt-3 leading-relaxed">Stress controls are a temporary simulation — they never change your real transactions, goals or investments.</p>
        </div>
      </div>

      <!-- BEFORE / AFTER -->
      <div class="mt-7">
        <p class="text-xs font-semibold text-ink/50 mb-3">Current vs. stressed</p>
        <div class="grid sm:grid-cols-2 gap-4" id="beforeAfter"></div>
      </div>

      <!-- DEPLETION TIMELINE -->
      <div class="mt-7">
        <p class="text-xs font-semibold text-ink/50 mb-1">Asset depletion timeline <span class="font-normal text-ink/40">(simulation assumption: cash → debt → gold → equity)</span></p>
        <div id="runwaySchedule" class="space-y-2.5 mt-3"></div>
      </div>

      <!-- INVESTMENT STRESS TABLE -->
      <div class="mt-7">
        <p class="text-xs font-semibold text-ink/50 mb-3">Investment stress — market drawdown impact</p>
        <div class="card overflow-hidden">
          <div class="overflow-x-auto nice-scroll">
            <table class="w-full text-sm">
              <thead><tr class="text-left text-xs text-ink/45 border-b border-[#F0EDE3] bg-[#FAF8F2]">
                <th class="px-4 py-2.5 font-semibold">Asset</th>
                <th class="px-4 py-2.5 font-semibold text-right">Original value</th>
                <th class="px-4 py-2.5 font-semibold text-right">Drawdown</th>
                <th class="px-4 py-2.5 font-semibold text-right">Simulated value</th>
                <th class="px-4 py-2.5 font-semibold text-right">Change</th>
              </tr></thead>
              <tbody id="investStressBody"></tbody>
            </table>
          </div>
          ${hasHoldings ? '' : `<div class="px-4">${emptyRow('No investments to stress-test yet.')}</div>`}
        </div>
      </div>

      <!-- TRANSPARENCY -->
      <details class="mt-6 bg-[#FAF8F2] border border-[#ECE8DC] rounded-lg p-3.5">
        <summary class="text-xs font-semibold text-ink/70 cursor-pointer select-none">How is this calculated?</summary>
        <ul class="text-xs text-ink/60 leading-relaxed mt-2.5 space-y-1.5 list-disc pl-4">
          <li>Income comes from this month's income transactions already in your app.</li>
          <li>Expenses come from this month's expense transactions already in your app.</li>
          <li>Stress assumptions (income reduction, emergency expense) temporarily modify income/expenses for this simulation only.</li>
          <li>Market drawdown temporarily reduces Equity and Gold holding values — Debt and Liquid Cash are unaffected.</li>
          <li>Runway estimates how long your available assets could cover the simulated monthly deficit.</li>
          <li>Asset depletion order (Liquid Cash → Debt → Gold → Equity) is a simulation assumption, not financial advice.</li>
          <li>Taxes, liquidation costs and exact asset-sale timing are not modeled.</li>
          <li>All data shown is demo data — illustrative only, not financial advice.</li>
        </ul>
      </details>
    </div>

    <div class="card card-hover p-5 md:p-6 border-2 border-moss-400/40">
      <div class="flex items-center gap-2 mb-1"><div class="icon-box w-8 h-8" style="background:#C4622D14;color:#C4622D">${ICONS.cart}</div><p class="font-display font-extrabold tracking-tight">Purchase Trade-off Simulator</p></div>
      <p class="text-sm text-ink/55 mb-5">See what a purchase really costs — today, over 5 years, and against a goal's timeline.</p>

      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <div>
            <label class="block text-xs font-semibold text-ink/60 mb-1" for="ptAmount">Purchase amount (₹)</label>
            <input type="number" id="ptAmount" min="0" value="25000" class="w-full border border-[#E3DFD1] rounded-lg px-3 py-2 text-sm">
          </div>
          <div class="mt-4">
            <label class="block text-xs font-semibold text-ink/60 mb-1" for="ptGoal">Goal to compare against</label>
            <select id="ptGoal" class="w-full border border-[#E3DFD1] rounded-lg px-3 py-2 text-sm bg-white">${goalOptions}</select>
          </div>
          <p class="text-[11px] text-ink/40 mt-3 leading-relaxed">Illustrative projection assumes a 10% annual growth rate if the amount were invested instead. This is not a guaranteed return — actual markets vary.</p>
        </div>
        <div class="bg-[#FAF8F2] rounded-xl p-4 space-y-3" id="ptResults"></div>
      </div>
    </div>
  `;

  const iEl=document.getElementById('rIncome'), eEl=document.getElementById('rExpense'), dEl=document.getElementById('rDraw');
  iEl.value=runwayState.incomeCut; eEl.value=runwayState.emergencyExpense; dEl.value=runwayState.drawdown;
  [iEl,eEl,dEl].forEach(x=>x.addEventListener('input', updateRunwayView));
  document.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = RUNWAY_PRESETS[btn.dataset.preset];
      runwayState = { incomeCut:p.incomeCut, emergencyExpense:p.emergencyExpense, drawdown:p.drawdown };
      iEl.value=p.incomeCut; eEl.value=p.emergencyExpense; dEl.value=p.drawdown;
      updateRunwayView();
      toast(btn.dataset.preset==='reset' ? 'Reset to current situation' : 'Scenario applied');
    });
  });
  updateRunwayView();

  document.getElementById('ptAmount').addEventListener('input', updatePurchaseView);
  document.getElementById('ptGoal').addEventListener('change', updatePurchaseView);
  updatePurchaseView();
}

function updateRunwayView(){
  runwayState.incomeCut = clampNum(document.getElementById('rIncome').value,0,100);
  runwayState.emergencyExpense = clampNum(document.getElementById('rExpense').value,0,50000);
  runwayState.drawdown = clampNum(document.getElementById('rDraw').value,0,40);
  document.getElementById('rIncomeVal').textContent = runwayState.incomeCut+'%';
  document.getElementById('rExpenseVal').textContent = fmt(runwayState.emergencyExpense);
  document.getElementById('rDrawdown').textContent = '−'+runwayState.drawdown+'%';

  const baseline = computeRunway(0,0,0);
  const r = computeRunway(runwayState.incomeCut, runwayState.emergencyExpense, runwayState.drawdown);
  const status = stressLevel(r.netCashFlow, r.runwayMonths);
  const runwayText = r.netCashFlow>=0 ? 'Positive cash flow' : (formatRunway(r.runwayMonths) || '0 days');

  const big = document.getElementById('runwayBig');
  big.textContent = runwayText;
  big.style.color = '#fff';

  const pill = document.getElementById('stressPill');
  pill.textContent = status.label;
  pill.style.color = status.color;
  pill.style.background = status.bg;
  pill.style.border = '1px solid '+status.border;

  document.getElementById('heroStats').innerHTML = `
    ${heroStat('Liquid Assets', fmt(r.liquidCash), ICONS.wallet)}
    ${heroStat('Monthly Burn', r.netCashFlow>=0 ? fmt(0) : fmt(r.burn), ICONS.trendDown)}
    ${heroStat('Monthly Income', fmt(r.adjIncome), ICONS.trendUp)}
    ${heroStat('Monthly Net Cash Flow', (r.netCashFlow>=0?'+':'−')+fmt(Math.abs(r.netCashFlow)), ICONS.sim)}
  `;

  document.getElementById('beforeAfter').innerHTML = `
    <div class="card p-4 md:p-5">
      <p class="text-[11px] font-bold tracking-wide text-ink/50 mb-3">CURRENT</p>
      ${compareRow('Monthly income', fmt(baseline.adjIncome))}
      ${compareRow('Monthly expenses', fmt(baseline.adjExpenses))}
      ${compareRow('Net cash flow', (baseline.netCashFlow>=0?'+':'−')+fmt(Math.abs(baseline.netCashFlow)), baseline.netCashFlow>=0?'text-moss-600':'text-danger')}
      ${compareRow('Available assets', fmt(baseline.totalPool))}
      ${compareRow('Financial runway', baseline.netCashFlow>=0?'Positive cash flow':(formatRunway(baseline.runwayMonths)||'0 days'))}
    </div>
    <div class="card p-4 md:p-5 border-2 border-clay/30">
      <p class="text-[11px] font-bold tracking-wide text-clay mb-3">STRESSED</p>
      ${compareRow('Monthly income', fmt(r.adjIncome))}
      ${compareRow('Monthly expenses', fmt(r.adjExpenses))}
      ${compareRow('Net cash flow', (r.netCashFlow>=0?'+':'−')+fmt(Math.abs(r.netCashFlow)), r.netCashFlow>=0?'text-moss-600':'text-danger')}
      ${compareRow('Available assets', fmt(r.totalPool))}
      ${compareRow('Financial runway', runwayText, r.netCashFlow>=0?'text-moss-600':(status.tone==='CRITICAL'?'text-danger':'text-clay'))}
    </div>
  `;

  document.getElementById('runwaySchedule').innerHTML = r.schedule.length ? r.schedule.map(a=>{
    const widthPct = isFinite(r.runwayMonths)&&r.runwayMonths>0 ? Math.min(100,(a.monthsCovered/r.runwayMonths)*100) : (r.totalPool>0 ? a.amount/r.totalPool*100 : 0);
    const barColor = {'Liquid Cash':'#22603F','Debt':'#5B7FA6','Gold':'#8C7B4E','Equity':'#C4622D'}[a.label] || '#8C7B4E';
    return `<div>
      <div class="flex justify-between text-xs mb-1"><span class="font-semibold">${a.label}</span>
        <span class="text-ink/50">${fmt(a.amount)} · ${isFinite(a.monthsCovered)?formatRunway(a.monthsCovered)+' covered':'—'}</span></div>
      <div class="progress-track h-2.5"><div class="progress-fill h-full rounded-full" style="width:${widthPct}%; background:${barColor}"></div></div>
    </div>`;
  }).join('') : emptyRow('No liquid assets to model.');

  document.getElementById('investStressBody').innerHTML = ['Equity','Debt','Gold'].filter(t=>r.byType[t]!==undefined && state.investments.some(i=>i.type===t)).map(t=>{
    const original = state.investments.filter(i=>i.type===t).reduce((s,i)=>s+i.currentValue,0);
    const simulated = r.byType[t]||0;
    const diff = simulated-original;
    const dd = (t==='Equity'||t==='Gold') ? r.drawdownPct : 0;
    return `<tr class="border-b border-[#F5F3EA]">
      <td class="px-4 py-2.5 font-semibold">${t}</td>
      <td class="px-4 py-2.5 text-right num">${fmt(original)}</td>
      <td class="px-4 py-2.5 text-right num ${dd>0?'text-clay':'text-ink/40'}">${dd>0?'−'+dd+'%':'0%'}</td>
      <td class="px-4 py-2.5 text-right num font-semibold">${fmt(simulated)}</td>
      <td class="px-4 py-2.5 text-right num font-bold ${diff<0?'text-danger':'text-ink/40'}">${diff<0?'−'+fmt(Math.abs(diff)):fmt(0)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5">${emptyRow('No investments to stress-test yet.')}</td></tr>`;
}
function heroStat(label,val,icon){
  return `<div class="bg-white/5 border border-white/10 rounded-xl px-3.5 py-3 hover:bg-white/[0.08] transition-colors">
    <div class="flex items-center gap-1.5 text-white/40">${icon?`<span class="shrink-0">${icon}</span>`:''}<p class="text-[10px] font-semibold uppercase tracking-wide">${label}</p></div>
    <p class="num text-base md:text-lg font-extrabold text-white mt-1">${val}</p>
  </div>`;
}
function compareRow(label,val,cls){
  return `<div class="flex items-center justify-between py-1.5">
    <span class="text-xs text-ink/55">${label}</span>
    <span class="num text-sm font-bold ${cls||''}">${val}</span>
  </div>`;
}

function updatePurchaseView(){
  const amount = parseFloat(document.getElementById('ptAmount').value)||0;
  const goal = state.goals.find(g=>g.id===document.getElementById('ptGoal').value);
  const inc = sumBy(monthTx(thisMonth),'income');
  const exp = sumBy(monthTx(thisMonth),'expense');
  const freeCash = inc-exp;
  const pctOfIncome = inc>0 ? (amount/inc*100) : 0;
  const fv5 = amount * Math.pow(1.10, 5);
  const growth = fv5 - amount;

  let delayHtml;
  if(!goal){
    delayHtml = `<div class="text-xs text-ink/45">Create a goal to see the delay estimate.</div>`;
  } else if(freeCash<=0){
    delayHtml = `<div class="text-xs text-clay font-semibold">Not enough monthly surplus to estimate a delay — reduce expenses or increase income first.</div>`;
  } else {
    const delayMonths = Math.ceil(amount/freeCash);
    delayHtml = `
      <div class="flex items-center justify-between pt-3 border-t border-[#EEEBE0]">
        <span class="text-xs text-ink/55">Delay to "${escapeHtml(goal.name)}"</span>
        <span class="text-sm font-bold text-clay">≈ ${delayMonths} month${delayMonths===1?'':'s'} later</span>
      </div>`;
  }

  document.getElementById('ptResults').innerHTML = `
    <div class="flex items-center justify-between">
      <span class="text-xs text-ink/55">Immediate spending impact</span>
      <span class="num text-lg font-extrabold text-clay">${fmt(amount)}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-ink/55">% of monthly income</span>
      <span class="num text-sm font-bold">${pctOfIncome.toFixed(0)}%</span>
    </div>
    <div class="flex items-center justify-between pt-3 border-t border-[#EEEBE0]">
      <span class="text-xs text-ink/55">Illustrative value in 5 years if invested*</span>
      <span class="num text-sm font-bold text-moss-600">${fmt(fv5)}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs text-ink/55">Opportunity cost (growth foregone)*</span>
      <span class="num text-sm font-bold text-moss-600">${fmt(growth)}</span>
    </div>
    ${delayHtml}
    <p class="text-[10px] text-ink/40 pt-1">*Illustrative projection only — assumes 10%/yr, not a guaranteed return.</p>
  `;
}

/* ---------------- Init ---------------- */
function waitForChartThenInit(attemptsLeft){
  if (typeof Chart !== 'undefined' || attemptsLeft <= 0) {
    renderDashboard();
    return;
  }
  setTimeout(function(){ waitForChartThenInit(attemptsLeft - 1); }, 50);
}
waitForChartThenInit(100); // waits up to ~5s for Chart.js to finish loading from any CDN
</script>
</body>
</html>
